<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0%;
            padding: 0%;
        }

        html, body{
            height: 100%;
            width: 100%;
            background-color: black;
        }

        #main{
            height: 100%;
            display:flex;
            justify-content: center;
            align-items: center;
        }

        #btn{
            padding: 10px 12px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: 600;
            border-radius: 8px;
            color: rgb(63, 20, 216);
            background-color: rgb(83, 164, 137);
            cursor:pointer;
        }

        #inp{
            display:none;
        }

        #btn:hover{
            background-color: rgb(83, 164, 13);
        }
        
    </style>
</head>
<body>
    <div id="main">
        <input id="inp" type="file">
        <div id="btn">
            Upload file
        </div>
    </div>
    <script src="practice2.js"></script>
</body>
</html>
