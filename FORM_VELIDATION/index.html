<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Password Validation</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .container{
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .container h2{
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-group{
      margin-bottom: 18px;
    }

    .input-group label{
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    .input-group input{
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus{
      border-color: #007bff;
    }

    .error{
      color: red;
      font-size: 13px;
      margin-top: 5px;
    }

    button{
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover{
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Login Form</h2>

    <form id="loginForm">

      <div class="input-group">
        <label>Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <div class="error" id="emailError"></div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <div class="error" id="passwordError"></div>
      </div>

      <button type="submit">Login</button>

    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
